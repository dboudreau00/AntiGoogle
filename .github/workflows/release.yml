name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.0)'
        required: true

permissions:
  contents: write   # needed to create the release and upload assets

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Test before shipping
        run: |
          dotnet test AntiGoogle.sln --configuration Release
          dotnet run --project tests/AntiGoogle.Verify --configuration Release

      - name: Publish self-contained win-x64
        shell: pwsh
        run: ./publish-windows.ps1 -Configuration Release

      - name: Package
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') {
            $env:GITHUB_REF -replace 'refs/tags/', ''
          } else {
            '${{ github.event.inputs.tag }}'
          }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

          # Ship the licence and the honest limitations alongside the binary. Someone who
          # downloads only the zip should still get both.
          Copy-Item LICENSE, README.md, CHANGELOG.md, SECURITY.md release/win-x64/

          $zip = "artifacts/AntiGoogle-$tag-win-x64.zip"
          Compress-Archive -Path release/win-x64/* -DestinationPath $zip -Force

          # Checksums matter more than usual here: this binary edits your hosts file and firewall.
          Get-FileHash $zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Out-File artifacts/SHA256SUMS.txt -Encoding ascii -Append
          Get-FileHash release/win-x64/AntiGoogle.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  AntiGoogle.exe" } |
            Out-File artifacts/SHA256SUMS.txt -Encoding ascii -Append

          Copy-Item release/win-x64/AntiGoogle.exe artifacts/
          Get-Content artifacts/SHA256SUMS.txt

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/AntiGoogle-*-win-x64.zip
            artifacts/AntiGoogle.exe
            artifacts/SHA256SUMS.txt
          body_path: docs/RELEASE-NOTES.md
          draft: true          # deliberately a draft — a human presses publish
          prerelease: true     # 0.x, and the elevated path is not yet verified end to end
          fail_on_unmatched_files: true
